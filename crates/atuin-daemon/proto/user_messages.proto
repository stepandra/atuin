// What the daemon would tell the user, for the clients following it to show.
syntax = "proto3";

package user_messages;

import "common.proto";

// How much a message matters to the user.
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_INFO = 1;
  SEVERITY_WARN = 2;
  SEVERITY_ERROR = 3;
}

// A message for the user, in the daemon's language.
message Message {
  Severity severity = 1;
  string text = 2;
}

// The client sends none: closing its side of the stream asks for the end of it.
message FollowRequest {}

message FollowReply {
  oneof event {
    Message message = 1;
    common.Lagged lagged = 2;
  }
}

service UserMessages {
  // Streams every message the daemon shows from when it answers on. Once the client closes its
  // side, the daemon sends the messages it showed until then and ends the stream.
  rpc Follow(stream FollowRequest) returns (stream FollowReply);
}
